{% extends "layout.html" %}

{% block title %}Tic-Tac-Toe{% endblock %}

{% block content %}
<div class="game-header">
    <a href="/" class="back-link">← Back to Lobby</a>
    <h1 class="page-title">Tic-Tac-Toe</h1>
    <p class="page-subtitle">Classic 3x3 grid with smart Python AI & 2-player pass-and-play.</p>
</div>

<div class="game-arena">
    <!-- Controls & Settings -->
    <div class="control-panel">
        <div class="control-group">
            <label for="ttt-mode">Game Mode:</label>
            <select id="ttt-mode" class="select-input">
                <option value="ai">Play vs. Computer</option>
                <option value="pvp">2-Player (Pass & Play)</option>
            </select>
        </div>

        <div class="control-group" id="difficulty-group">
            <label for="ttt-difficulty">AI Difficulty:</label>
            <select id="ttt-difficulty" class="select-input">
                <option value="easy">Easy (Random)</option>
                <option value="medium" selected>Medium (Tactical)</option>
                <option value="unbeatable">Unbeatable (Minimax)</option>
            </select>
        </div>

        <button id="ttt-reset-btn" class="btn btn-secondary">New Game</button>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
        <div class="score-card player-x active" id="score-card-x">
            <span class="score-label">Player X</span>
            <span class="score-value" id="score-x">0</span>
        </div>
        <div class="score-card ties" id="score-card-tie">
            <span class="score-label">Ties</span>
            <span class="score-value" id="score-tie">0</span>
        </div>
        <div class="score-card player-o" id="score-card-o">
            <span class="score-label" id="label-player-o">Computer (O)</span>
            <span class="score-value" id="score-o">0</span>
        </div>
    </div>

    <!-- Turn / Result Banner -->
    <div class="status-banner" id="ttt-status">
        Player X's Turn
    </div>

    <!-- 3x3 Board Grid -->
    <div class="ttt-board" id="ttt-board">
        <button class="ttt-cell" data-index="0" aria-label="Cell 1"></button>
        <button class="ttt-cell" data-index="1" aria-label="Cell 2"></button>
        <button class="ttt-cell" data-index="2" aria-label="Cell 3"></button>
        <button class="ttt-cell" data-index="3" aria-label="Cell 4"></button>
        <button class="ttt-cell" data-index="4" aria-label="Cell 5"></button>
        <button class="ttt-cell" data-index="5" aria-label="Cell 6"></button>
        <button class="ttt-cell" data-index="6" aria-label="Cell 7"></button>
        <button class="ttt-cell" data-index="7" aria-label="Cell 8"></button>
        <button class="ttt-cell" data-index="8" aria-label="Cell 9"></button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/tictactoe.js') }}"></script>
{% endblock %}

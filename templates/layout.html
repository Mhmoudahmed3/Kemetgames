<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini Arcade{% endblock %} - CS50 Games</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Google Fonts for a clean, modern arcade look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <span class="logo-icon">🕹️</span>
                <span class="logo-text">Mini Arcade</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/tictactoe" class="nav-link">Tic-Tac-Toe</a>
                <a href="/connect4" class="nav-link">Connect 4</a>
                <a href="/rps" class="nav-link">Rock-Paper-Scissors</a>
                <a href="/cards" class="nav-link">Cards</a>
                <a href="/about" class="nav-link nav-about">About CS50</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="page-container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Built with ❤️ for <strong>CS50: Introduction to Computer Science</strong></p>
        <p class="footer-sub">HTML • CSS • JavaScript • Python (Flask)</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
